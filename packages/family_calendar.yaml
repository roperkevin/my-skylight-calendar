# ==============================================================================
#  FAMILY CALENDAR BACKEND PACKAGE
# ==============================================================================
#  INSTRUCTIONS:
#  1. Place this file in your /config/packages/ folder.
#  2. Ensure your configuration.yaml has: 
#     homeassistant:
#       packages: !include_dir_named packages
#  3. RESTART Home Assistant.
# ==============================================================================

# 1. HELPERS (The Variables)
input_text:
  # Filter Toggles.
  # week-planner-card's `filter` option HIDES events whose title matches the regex:
  #   "^$" = matches nothing  -> all events VISIBLE
  #   ".*" = matches anything -> all events HIDDEN
  school_calendar_filter:
    name: School Filter
    initial: "^$"
  daniel_calendar_filter:
    name: Daniel Filter
    initial: "^$"
  weather_calendar_filter:
    name: Weather Filter
    initial: "^$"
  family_calendar_filter:
    name: Family Filter
    initial: "^$"
  birthdays_calendar_filter:
    name: Birthdays Filter
    initial: "^$"
  holidays_calendar_filter:
    name: Holidays Filter
    initial: "^$"

  # Event Form Data
  calendar_event_title:
    name: Event Title
    icon: mdi:format-title
  calendar_event_description:
    name: Event Description
    icon: mdi:text

input_select:
  # The dropdown list for "Who is this event for?"
  calendar_select:
    name: Select Calendar
    options:
      - School
      - Daniel
      - Weather
      - Family
    icon: mdi:calendar-check
  
  # The View selector (Week, Month, etc)
  calendar_view:
    name: Calendar View
    options:
      - Today
      - Tomorrow
      - Week
      - Biweek
      - Month
    initial: Week

input_datetime:
  # Event start/end times
  calendar_event_start:
    has_date: true
    has_time: true
  calendar_event_end:
    has_date: true
    has_time: true
  calendar_day_event_start:
    has_date: true
    has_time: false
  calendar_day_event_end:
    has_date: true
    has_time: false

input_boolean:
  # UI Toggles
  calendar_all_day_event:
    name: All Day Event
    icon: mdi:calendar-clock

# 2. TEMPLATE SENSORS (Tomorrow's agenda for the header alert)
template:
  # Collects tomorrow's events from every calendar into one sensor the
  # dashboard's header alert banner reads. State = number of events tomorrow
  # (the banner hides itself at 0); the `events` attribute holds them sorted
  # with all-day events first, then by start time.
  - triggers:
      # Refresh every 15 minutes (which also rolls "tomorrow" over shortly
      # after midnight), on startup, and right after an event is created so
      # additions made from the Add Event popup show up immediately.
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: call_service
        event_data:
          domain: calendar
          service: create_event
    actions:
      # Brief pause so a just-created event is committed before we query.
      - delay:
          seconds: 2
      - action: calendar.get_events
        target:
          entity_id:
            # <--- UPDATE THESE ENTITIES to match your calendars (keep in sync
            # with dashboard.yaml). calendar.weather is left out on purpose:
            # forecast feeds would fill the alert with noise.
            - calendar.school
            - calendar.daniel
            - calendar.family
            - calendar.birthdays
            - calendar.holidays
        data:
          start_date_time: "{{ (now() + timedelta(days=1)).replace(hour=0, minute=0, second=0, microsecond=0).isoformat() }}"
          end_date_time: "{{ (now() + timedelta(days=2)).replace(hour=0, minute=0, second=0, microsecond=0).isoformat() }}"
        response_variable: agenda
    sensor:
      - name: Tomorrow Events
        unique_id: family_calendar_tomorrow_events
        icon: mdi:calendar-alert
        state: "{{ agenda.values() | map(attribute='events') | map('length') | sum }}"
        attributes:
          events: >-
            {% set ns = namespace(items=[]) %}
            {% for cal, data in agenda.items() %}
              {% for ev in data.events %}
                {% set ns.items = ns.items + [{
                     'summary': ev.summary,
                     'start': ev.start,
                     'all_day': 'T' not in ev.start,
                     'calendar': cal
                   }] %}
              {% endfor %}
            {% endfor %}
            {{ ns.items | sort(attribute='start') }}

# 3. SCRIPTS (The Logic)
script:
  # --- Filter Toggle (shared by every calendar button) ---
  # The dashboard buttons call this with the filter helper they control, e.g.:
  #   perform_action: script.toggle_calendar_filter
  #   data:
  #     filter_entity: input_text.school_calendar_filter
  # Adding a family member = add an input_text above + a button in the dashboard.
  toggle_calendar_filter:
    alias: Toggle Calendar Visibility Filter
    fields:
      filter_entity:
        name: Filter Entity
        description: The input_text filter helper to toggle between "^$" (show) and ".*" (hide).
        required: true
        selector:
          entity:
            filter:
              domain: input_text
    sequence:
      - action: input_text.set_value
        target:
          entity_id: "{{ filter_entity }}"
        data:
          value: "{% if is_state(filter_entity, '.*') %}^${% else %}.*{% endif %}"

  # --- Add Event Logic ---
  add_calendar_event:
    alias: Process Add Calendar Event
    sequence:
      - variables:
          # ====================================================================
          # CONFIGURATION: ENTITY MAPPING
          # Map the Dropdown Name (Left) to your Entity ID (Right).
          # ====================================================================
          calendar_map:
            "School": "calendar.school"
            "Daniel": "calendar.daniel"
            "Weather": "calendar.weather"
            "Family": "calendar.family"

          # Selects the entity based on the map above
          target_calendar: "{{ calendar_map.get(states('input_select.calendar_select'), 'calendar.family') }}"
          event_title: "{{ states('input_text.calendar_event_title') | trim }}"
          all_day: "{{ is_state('input_boolean.calendar_all_day_event', 'on') }}"

      # --- VALIDATION ---
      - if:
          - condition: template
            value_template: "{{ event_title == '' }}"
        then:
          - action: browser_mod.notification
            data:
              message: "⚠️ Please enter an event title."
          - stop: "Missing event title"

      - if:
          - condition: template
            value_template: >-
              {{ not all_day and
                 states('input_datetime.calendar_event_end') <= states('input_datetime.calendar_event_start') }}
        then:
          - action: browser_mod.notification
            data:
              message: "⚠️ End time must be after start time."
          - stop: "Invalid time range"

      - if:
          - condition: template
            value_template: >-
              {{ all_day and
                 states('input_datetime.calendar_day_event_end') < states('input_datetime.calendar_day_event_start') }}
        then:
          - action: browser_mod.notification
            data:
              message: "⚠️ End date can't be before the start date."
          - stop: "Invalid date range"

      - choose:
          # Scenario A: All Day Event
          - conditions: "{{ all_day }}"
            sequence:
              - variables:
                  start_date: "{{ states('input_datetime.calendar_day_event_start') }}"
                  # Home Assistant's end_date is EXCLUSIVE (the event ends at
                  # midnight leading into it), so a one-day event must end on the
                  # following day. Bump the end date when it equals the start
                  # (end < start is rejected by the validation above).
                  end_date: >-
                    {%- set raw_end = states('input_datetime.calendar_day_event_end') -%}
                    {%- if raw_end > start_date -%}
                      {{ raw_end }}
                    {%- else -%}
                      {{ (strptime(start_date, '%Y-%m-%d') + timedelta(days=1)).strftime('%Y-%m-%d') }}
                    {%- endif -%}
              - action: calendar.create_event
                target:
                  entity_id: "{{ target_calendar }}"
                data:
                  summary: "{{ event_title }}"
                  description: "{{ states('input_text.calendar_event_description') }}"
                  start_date: "{{ start_date }}"
                  end_date: "{{ end_date }}"

          # Scenario B: Timed Event
          - conditions: "{{ not all_day }}"
            sequence:
              - action: calendar.create_event
                target:
                  entity_id: "{{ target_calendar }}"
                data:
                  summary: "{{ event_title }}"
                  description: "{{ states('input_text.calendar_event_description') }}"
                  start_date_time: "{{ states('input_datetime.calendar_event_start') }}"
                  end_date_time: "{{ states('input_datetime.calendar_event_end') }}"

      # Cleanup and Close
      - action: input_text.set_value
        target:
          entity_id: input_text.calendar_event_title
        data:
          value: ""
      - action: input_text.set_value
        target:
          entity_id: input_text.calendar_event_description
        data:
          value: ""
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.calendar_all_day_event
      - action: browser_mod.close_popup
        data: {}
      - action: browser_mod.notification
        data:
          message: "✓ Event added to {{ states('input_select.calendar_select') }}"

  # --- Photo Screensaver (optional) ---
  # Opens a fullscreen photo on every Browser Mod-registered browser; any tap or
  # mouse movement closes it (autoclose). Upload a photo to /config/www/photos/
  # first. For true idle-detection screensavers, kiosk software such as Fully
  # Kiosk Browser does it better - this is a simple built-in alternative you can
  # trigger from an automation (see the examples at the bottom of this file).
  screensaver_start:
    alias: Start Photo Screensaver
    sequence:
      - action: browser_mod.popup
        data:
          size: fullscreen
          autoclose: true
          hide_header: true
          content:
            type: picture
            image: /local/photos/family.jpg # <--- UPDATE THIS (upload to /config/www/photos/)
            tap_action:
              action: none

