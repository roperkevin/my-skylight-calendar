name: Validate YAML

on:
  push:
    branches: [main]
  pull_request:

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint YAML files
        run: yamllint .
      - name: Parse check
        run: |
          python3 - <<'EOF'
          import yaml, sys
          files = ['dashboard.yaml', 'packages/family_calendar.yaml', 'themes/skylight.yaml']
          failed = False
          for f in files:
              try:
                  yaml.safe_load(open(f))
                  print(f'{f}: OK')
              except Exception as e:
                  print(f'{f}: FAILED - {e}')
                  failed = True
          sys.exit(1 if failed else 0)
          EOF
