                  icon: mdi:clipboard-check-outline
                  tap_action:
                    action: navigate
                    navigation_path: "#chores"
                  styles: |
                    .bubble-button-card-container {
                      background: none !important;
                      border-radius: var(--skylight-radius-card, 10px) !important;
                    }
                    ha-card {
                      background: none !important;
                      border-radius: var(--skylight-radius-card, 10px) !important;
                      border: 1px solid var(--skylight-btn-off-border, #e9ecef) !important;
                      box-shadow: none !important;
                    }
                    .bubble-button-background {
                      opacity: 1 !important;
                      border-radius: var(--skylight-radius-card, 10px) !important;
                      background-color: var(--skylight-btn-off-bg, #ffffff) !important;
                    }
                    .bubble-icon-container {
                      border-radius: var(--skylight-radius-chip, 6px) !important;
                      background: var(--skylight-btn-off-icon-bg, rgba(0, 0, 0, 0.04)) !important;
                    }
                    .bubble-icon {
                      opacity: 1 !important;
                      color: var(--primary-text-color, #34343c) !important;
                    }
                    .bubble-name {
                      opacity: 1 !important;
                      font-weight: 600 !important;
                      letter-spacing: 0.01em !important;
                      color: var(--primary-text-color, #34343c) !important;
                    }
                - type: custom:bubble-card
                  card_type: select
                  entity: input_select.calendar_view
                  show_name: true
                  show_state: true
                  name: Select View
                  show_last_changed: false
                  show_attribute: false
                  styles: |
                    ha-card {
                      background: none !important;
                      border-radius: var(--skylight-radius-card, 10px) !important;
                      border: 1px solid var(--skylight-btn-off-border, #e9ecef) !important;
                      box-shadow: none !important;
                    }
                    .bubble-button-background, .bubble-select-background {
                      opacity: 1 !important;
                      border-radius: var(--skylight-radius-card, 10px) !important;
                      background-color: var(--skylight-btn-off-bg, #ffffff) !important;
                    }
                    .bubble-icon-container {
                      border-radius: var(--skylight-radius-chip, 6px) !important;
                      background: var(--skylight-btn-off-icon-bg, rgba(0, 0, 0, 0.04)) !important;
                    }
                    .bubble-icon { color: var(--primary-text-color, #34343c) !important; opacity: 1 !important; }
                    .bubble-name { color: var(--primary-text-color, #34343c) !important; font-weight: 600 !important; opacity: 1 !important; }
                    .bubble-state { color: var(--secondary-text-color, #757575) !important; opacity: 1 !important; }
        column_span: 10
      # --- End CONTROLS SECTION (Buttons) ---
      # --- START CALENDAR SECTION (Week Planner Card) ---
      - type: grid
        cards:
          - type: custom:config-template-card
            entities:
              - input_text.school_calendar_filter
              - input_text.daniel_calendar_filter
              - input_text.weather_calendar_filter
              - input_text.family_calendar_filter
              - input_text.holidays_calendar_filter
              - input_text.birthdays_calendar_filter
              - input_select.calendar_view
            variables:
              SCHOOLCAL: states['input_text.school_calendar_filter']?.state
              DANIELCAL: states['input_text.daniel_calendar_filter']?.state
              WEATHERCAL: states['input_text.weather_calendar_filter']?.state
              FAMCAL: states['input_text.family_calendar_filter']?.state
              HOLCAL: states['input_text.holidays_calendar_filter']?.state
              BIRCAL: states['input_text.birthdays_calendar_filter']?.state
              VIEW: states['input_select.calendar_view']?.state
              STARTDAY: |
                (() => {
                  const calendarView = states['input_select.calendar_view']?.state;
                  if (calendarView === 'Today') return 'today';
                  if (calendarView === 'Tomorrow') return 'tomorrow';
                  // Fallback <--- UPDATE THIS IF NEEDED, valid values are: monday, tuesday, wednesday, thursday, friday, saturday, sunday
                  return 'monday';
                })()
              DAYS: |
                (() => {
                  const calendarView = states['input_select.calendar_view']?.state;
                  if (calendarView === 'Today') return 1;
                  if (calendarView === 'Tomorrow') return 1;
                  if (calendarView === 'Week') return 7;
                  if (calendarView === 'Biweek') return 14;
                  // else return "month"
                  return "month";
                })()
              COLS: |
                (() => {
                  const calendarView = states['input_select.calendar_view']?.state;
                  if (calendarView === 'Today' || calendarView === 'Tomorrow') return 1;
                  return 7;
                })()
              HEIGHT_CSS: |
                (() => {
                  const calendarView = states['input_select.calendar_view']?.state;
                  // Month view renders 5-6 rows of tiles, which can never fit a
                  // fixed 70vh card, so let it grow. The shorter views keep the
                  // clamped height so the card fills the screen nicely. Keep the
                  // view list in sync with the DAYS template above: anything
                  // unrecognized falls through to a month layout there, so it
                  // must get the auto height here too.
                  const clampedViews = ['Today', 'Tomorrow', 'Week', 'Biweek'];
                  if (clampedViews.includes(calendarView)) {
                    // overflow-y is a safety net: an unusually event-heavy day
                    // scrolls inside the card instead of spilling past its
                    // rounded bottom edge.
                    return 'height: clamp(480px, 70vh, 900px) !important; max-height: clamp(480px, 70vh, 900px) !important; overflow-y: auto !important;';
                  }
                  return 'height: auto !important; max-height: none !important;';
                })()
              WEEKEND_CSS: |
                (() => {
                  const calendarView = states['input_select.calendar_view']?.state;
                  if (calendarView === 'Today' || calendarView === 'Tomorrow') return '';
                  // Keep this in sync with the STARTDAY fallback above.
                  const startingDay = 'monday';
                  const week = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
                  const idx = week.indexOf(startingDay);
                  // Header cells are :nth-of-type(offset + 2), offset counted from the starting day.
                  const sat = ((5 - idx + 7) % 7) + 2;
                  const sun = ((6 - idx + 7) % 7) + 2;
                  return '.container > .day.header:nth-of-type(' + sat + ') .text, ' +
                         '.container > .day.header:nth-of-type(' + sun + ') .text ' +
                         '{ color: var(--skylight-weekend-text-color, #df3c30) !important; }';
                })()
            card:
              type: custom:week-planner-card
              calendars:
                # --- MAP CALENDARS HERE ---
                - entity: calendar.school
                  name: School
                  color: "var(--school-default-primary-color)"
                  filter: ${ SCHOOLCAL }
                - entity: calendar.daniel
                  name: Daniel
                  color: "var(--daniel-default-primary-color)"
                  filter: ${ DANIELCAL }
                - entity: calendar.weather
                  name: Weather
                  color: "var(--weather-default-primary-color)"
                  filter: ${ WEATHERCAL }
                - entity: calendar.family
                  name: Family
                  color: "var(--family-default-primary-color)"
                  filter: ${ FAMCAL }
                - entity: calendar.birthdays
                  name: Birthdays
                  color: "var(--birthdays-default-primary-color)"
                  filter: ${ BIRCAL }
                - entity: calendar.holidays # <--- Check this entity ID after adding the Holiday integration
                  name: Holidays
                  color: "var(--holidays-default-primary-color)"
                  filter: ${ HOLCAL }
              days: ${ DAYS }
              startingDay: ${ STARTDAY }
              showNavigation: true
              showWeekDayText: false # <--- Requires week-planner-card v1.13.0 or higher
              startingDayOffset: 0
              hideWeekend: false
              noCardBackground: false
              compact: false
              weather:
                showCondition: true
                showTemperature: true
                showLowTemperature: true
                useTwiceDaily: false
                entity: weather.home # <--- UPDATE THIS ENTITY
              locale: en
              showLocation: true
              hidePastEvents: false
              hideDaysWithoutEvents: false
              hideTodayWithoutEvents: false
              combineSimilarEvents: true
              showLegend: false
              legendToggle: false
              card_mod:
                # config-template-card can't substitute ${...} inside a larger
                # string (it evals everything between the string's first "${"
                # and its final character), so the whole style must be ONE
                # template: a JS template literal returning the CSS, in which
                # COLS and WEEKEND_CSS interpolate normally.
                style: |-
                  ${`
                    /* === BASE SAFETY === */
                    :host {
                      overflow: hidden;
                    }

                    /* === CARD BASE === */
                    ha-card {
                      background: var(--skylight-cal-card-background, #ffffff) !important;
                      border-radius: var(--skylight-radius-card, 10px) !important;
                      border: none !important;
                      box-shadow: var(--skylight-shadow-card, rgba(104, 104, 104, 0.05) 0 2px 6px 0, rgba(211, 209, 209, 0.15) 0 0 0 1px) !important;
                      padding: 18px 20px 20px !important;
                      ${HEIGHT_CSS}
                    }

                    /* === NAVIGATION ROW (arrows + month title) === */
                    .container .navigation {
                      padding: 0.1em 0.2em 0.5em !important;
                      font-weight: 700 !important;
                      color: var(--primary-text-color) !important;
                    }

                    .container .navigation .title {
                      font-family: var(--skylight-heading-font-family, var(--primary-font-family)) !important;
                      font-size: 1.5em !important;
                      font-weight: 700 !important;
                      letter-spacing: -0.01em !important;
                    }

                    /* === GRID LAYOUT === */
                    /* The column count follows the selected view (7 for
                       Week/Biweek/Month, 1 for Today/Tomorrow) via the COLS
                       template variable above. */
                    .container {
                      display: grid !important;
                      grid-template-columns: repeat(${COLS}, minmax(0, 1fr)) !important;
                      grid-auto-flow: row dense !important;
                      gap: 6px !important;
                    }

                    .container .navigation,
                    .container .header {
                      grid-column: 1 / -1 !important;
                    }

                    /* === WEEKDAY LABEL CELLS === */
                    .day.header {
                      display: block !important;
                      grid-column: auto !important;
                      margin: 0 !important;
                      padding: 0.4em 0.2em !important;
                      text-align: center !important;
                      box-sizing: border-box !important;
                      background: transparent !important;
                      border: none !important;
                    }

                    .day.header .date .text {
                      font-size: 0.78em !important;
                      font-weight: 700 !important;
                      text-transform: uppercase !important;
                      letter-spacing: 0.12em !important;
                    }

                    /* === DAY TILES === */
                    /* Floating rounded tiles with gaps instead of ruled borders. */
                    .day:not(.header) {
                      background: var(--skylight-day-bg, #f6f8fa) !important;
                      border: 1px solid var(--skylight-day-border-color, #eaeaea) !important;
                      border-radius: var(--skylight-radius-tile, 6px) !important;
                      padding: 0.45em 0.45em 0.55em !important;
                      width: auto !important;
                      min-width: 0 !important;
                      margin: 0 !important;
                      box-sizing: border-box !important;
                      align-self: stretch !important;
                      justify-self: stretch !important;
                    }

                    /* Today: soft amber tile with an accent ring */
                    .day.today {
                      background: var(--skylight-today-bg, #e1f5fe) !important;
                      box-shadow: inset 0 0 0 2px var(--skylight-today-highlight-color, #0070cb) !important;
                    }

                    /* === DATE NUMBERS & WEEKDAY TEXT IN TILES === */
                    .day .date .number {
                      font-weight: 700 !important;
                      font-size: 2.2em !important;
                      line-height: 1.15 !important;
                      color: var(--primary-text-color) !important;
                    }

                    .day .date .text {
                      font-size: 0.9em !important;
                      font-weight: 600 !important;
                    }

                    .today .number {
                      display: inline-block !important;
                      background-color: var(--skylight-today-highlight-color, #0070cb) !important;
                      color: #ffffff !important;
                      border-radius: var(--skylight-radius-chip, 6px) !important;
                      padding-left: 10px !important;
                      padding-right: 10px !important;
                    }

                    /* Weather chip inside day tiles */
                    .day .weather {
                      font-size: 0.8em !important;
                      color: var(--secondary-text-color) !important;
                    }

                    /* === EVENT CHIPS === */
                    /* Soft tint of the calendar's color + a solid accent bar.
                       The color-mix line wins on modern browsers; older ones
                       keep the solid-color fallback above it. */
                    .event {
                      color: var(--skylight-event-text-color, #34343c) !important;
                      background-color: var(--skylight-event-bg, #ffffff) !important;
                      border: 1px solid var(--skylight-event-border, #eaeaea) !important;
                      border-left: 3px solid var(--border-color) !important;
                      border-radius: var(--skylight-radius-chip, 6px) !important;
                      padding: 0.35em 0.5em 0.4em 0.55em !important;
                      line-height: 1.25 !important;
                      font-size: 1.02em !important;
                      font-weight: 500 !important;
                      max-height: 84px !important;
                      overflow: hidden !important;
                    }

                    /* Bold title over a muted detail line */
                    .event .title,
                    .event .name,
                    .event .summary {
                      font-weight: 600 !important;
                    }

                    .event.past {
                      opacity: 0.35 !important;
                      filter: grayscale(0.4) !important;
                    }

                    .time {
                      color: var(--skylight-event-time-color, #757575) !important;
                      font-size: 0.78em !important;
                      font-weight: 600 !important;
                      letter-spacing: 0.02em !important;
                    }

                    .event .location {
                      font-size: 0.82em !important;
                      color: var(--skylight-event-time-color, #757575) !important;
                    }

                    /* "No events" placeholder */
                    .none {
                      background-color: transparent !important;
                      border: none !important;
                      color: var(--secondary-text-color) !important;
                      font-size: 0.9em !important;
                    }

                    /* === WEEKDAY LABEL COLORS === */

                    /* When showWeekDayText is true */
                    .day[data-weekday="1"] .date .text,
                    .day[data-weekday="2"] .date .text,
                    .day[data-weekday="3"] .date .text,
                    .day[data-weekday="4"] .date .text,
                    .day[data-weekday="5"] .date .text {
                      color: var(--skylight-weekday-text-color, #757575) !important;
                    }

                    .day[data-weekday="6"] .date .text,
                    .day[data-weekday="7"] .date .text {
                      color: var(--skylight-weekend-text-color, #df3c30) !important;
                    }
                    /* When showWeekDayText is false */
                    .container > .day.header .text {
                      color: var(--skylight-weekday-text-color, #757575) !important;
                    }
                    /* Weekend header cells: computed from the starting day by the
                       WEEKEND_CSS template variable, so they stay correct if you
                       change STARTDAY. */
                    ${WEEKEND_CSS}


                    /* === RESPONSIVE BREAKPOINTS === */
                    @media (max-width: 1024px) {
                      .day .date .number { font-size: 1.8em !important; }
                      .day .date .text   { font-size: 0.85em !important; }
                    }

                    @media (max-width: 768px) {
                      .day .date .number { font-size: 1.5em !important; }
                      .day .date .text   { font-size: 0.8em !important; }
                      .event { font-size: 0.85em !important; line-height: 1.2 !important; }
                      .time  { font-size: 0.72em !important; }
                    }

                    /* ========================================================= */
                    /* === MOBILE OVERLAP FIX + TWO‑LINE WRAP FOR TITLES ======== */
                    /* ========================================================= */
                    @media (max-width: 480px) {

                      :host {
                        font-size: clamp(10px, 2.6vw, 13px) !important;
                      }

                      ha-card {
                        padding: 10px 8px 12px !important;
                      }

                      /* Condensed headers */
                      .container .header,
                      .container .navigation {
                        padding: 0.25em 0.4em !important;
                      }

                      .container {
                        gap: 3px !important;
                      }

                      /* Day tiles tighter */
                      .day:not(.header) {
                        padding: 0.25em !important;
                        min-width: 0 !important;
                        border-radius: var(--skylight-radius-tile, 6px) !important;
                      }

                      /* Smaller date numbers */
                      .day .date .number {
                        font-size: clamp(1.1em, 4.5vw, 1.4em) !important;
                        line-height: 1.1 !important;
                      }
                      .day .date .text {
                        font-size: clamp(0.72em, 3.2vw, 0.85em) !important;
                        line-height: 1.1 !important;
                      }

                      /* Event chip reduced */
                      .event {
                        font-size: clamp(0.72em, 2.9vw, 0.85em) !important;
                        line-height: 1.15 !important;
                        padding: 0.25em 0.35em 0.25em 0.45em !important;
                        max-height: 62px !important;
                        border-left-width: 2px !important;
                      }

                      .time {
                        font-size: clamp(0.65em, 2.5vw, 0.78em) !important;
                      }

                      /* === TWO-LINE WRAP FOR TITLES === */
                      .event .title,
                      .event .name,
                      .event .summary,
                      .event .location,
                      .event .desc,
                      .event .description {
                        display: -webkit-box !important;
                        -webkit-box-orient: vertical !important;
                        -webkit-line-clamp: 2 !important;   /* <<< Two lines max */
                        overflow: hidden !important;
                        text-overflow: ellipsis !important;
                        white-space: normal !important;
                        line-height: 1.1em !important;
                        max-height: calc(1.1em * 2) !important;
                      }
                    }

                    /* Slightly larger phones / small tablets */
                    @media (min-width: 481px) and (max-width: 768px) {

                      :host {
                        font-size: clamp(11px, 2.2vw, 14px) !important;
                      }

                      .event {
                        max-height: 72px !important;
                      }

                      .event .title,
                      .event .name,
                      .event .summary {
                        display: -webkit-box !important;
                        -webkit-line-clamp: 2 !important;
                        overflow: hidden !important;
                      }
                    }
                  `}
            grid_options:
              columns: 120
              rows: 1
              showDescription: false
        column_span: 10
      # --- End CALENDAR SECTION (Week Planner Card) ---
