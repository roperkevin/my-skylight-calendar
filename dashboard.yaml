views:
  - type: sections
    max_columns: 10
    title: Family Calendar
    path: family-calendar
    # No view-level `theme:` here on purpose: pinning one would override your
    # profile (or backend-selected) theme and lock out `Skylight Dark` /
    # `frontend.set_theme` switching. Set the theme in your profile instead
    # (see the README's Theme section); add `theme: Skylight` back only if you
    # want to force the light theme for every user of this dashboard.
    sections:
      # --- START HEADER SECTION (Date & Weather) ---
      - type: grid
        cards:
          - type: custom:better-moment-card
            parentStyle: |
              line-height: normal; font-family: var(--primary-font-family);
            moment:
              - parentStyle: |
                  font-size:0.95em; text-align:center; margin-top:6px; font-weight:600; text-transform:uppercase; letter-spacing:0.22em; color:var(--secondary-text-color);
                templateRaw: |
                  {{moment format=cccc}}
              - parentStyle: |
                  font-size:1.4em; text-align:center; margin-top:2px; font-weight:500; color:var(--primary-text-color);
                templateRaw: |
                  {{moment format=LLLL dd, yyyy}}
              - parentStyle: |
                  font-size:4.4em; text-align:center; font-weight:300; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; color:var(--primary-text-color); font-family:var(--skylight-heading-font-family, var(--primary-font-family));
                templateRaw: |
                  {{moment format=HH:mm}}
            grid_options:
              columns: 20
            card_mod:
              style: |
                ha-card {
                  background: transparent !important;
                  box-shadow: none !important;
                  border: none !important;
                }
          - type: custom:weather-card
            entity: weather.home   # <--- UPDATE THIS ENTITY
            current: true
            details: true
            forecast: false
            grid_options:
              columns: 20
              rows: 3
            card_mod:
              style: |
                ha-card {
                  background: transparent !important;
                  box-shadow: none !important;
                  border: none !important;
                  font-family: var(--primary-font-family) !important;
                }
          - type: weather-forecast
            show_current: false
            show_forecast: true
            entity: weather.home   # <--- UPDATE THIS ENTITY
            forecast_type: daily
            name: Weather Forecast
            grid_options:
              columns: 20
              rows: 3
            card_mod:
              style: |
                ha-card {
                  background: transparent !important;
                  box-shadow: none !important;
                  border: none !important;
                }
                .forecast .temp {
                  font-weight: 600 !important;
                }
                .forecast .templow {
                  color: var(--secondary-text-color) !important;
                }
        column_span: 10
      # --- End HEADER SECTION (Date & Weather) ---
      # --- OPTIONAL: MEAL PLANNER STRIP (Skylight-style dinner row) ---
      # To enable: add a Local Calendar named "Dinner" (entity: calendar.dinner),
      # then uncomment this section. Add dinner plans as all-day events.
      # - type: grid
      #   cards:
      #     - type: custom:week-planner-card
      #       calendars:
      #         - entity: calendar.dinner # <--- UPDATE THIS ENTITY if yours differs
      #           name: Dinner
      #           color: "var(--family-default-primary-color)"
      #       days: 7
      #       startingDay: monday # keep in sync with the main calendar's STARTDAY
      #       showNavigation: false
      #       showWeekDayText: true
      #       compact: true
      #       hidePastEvents: false
      #       hideDaysWithoutEvents: false
      #       locale: en
      #       card_mod:
      #         style: |
      #           ha-card {
      #             background: var(--skylight-cal-card-background, #ffffff) !important;
      #             border-radius: var(--skylight-radius-card, 10px) !important;
      #             box-shadow: var(--skylight-shadow-card, rgba(104, 104, 104, 0.05) 0 2px 6px 0, rgba(211, 209, 209, 0.15) 0 0 0 1px) !important;
      #             border: none !important;
      #           }
      #           .event {
      #             color: var(--skylight-event-text-color, #34343c) !important;
      #             background-color: var(--skylight-event-bg, #ffffff) !important;
      #             border: 1px solid var(--skylight-event-border, #eaeaea) !important;
      #             border-left: 3px solid var(--border-color) !important;
      #             border-radius: var(--skylight-radius-chip, 6px) !important;
      #           }
      #   column_span: 10
      # --- End MEAL PLANNER STRIP ---
      # --- START CONTROLS SECTION (Buttons) ---
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: markdown
                content: " "
                card_mod:
                  style: |
                    ha-card { background: none; box-shadow: none; border: none; }
                grid_options:
                  columns: 18
                  rows: auto
            grid_options:
              columns: 120
              rows: auto
          - type: vertical-stack
            cards:
              - type: markdown
                content: "## Family Calendar"
                card_mod:
                  style: |
                    ha-card { background: none; box-shadow: none; border: none; }
                    h2 {
                      margin: 0;
                      font-family: var(--skylight-heading-font-family, var(--primary-font-family));
                      font-size: 1.7em;
                      font-weight: 700;
                      letter-spacing: -0.01em;
                      color: var(--primary-text-color);
                    }
                grid_options:
                  columns: 18
                  rows: auto
            grid_options:
              columns: 120
              rows: auto
          - type: custom:mod-card
            grid_options:
              columns: 45
              rows: auto
            card_mod:
              # card-mod can't attach to stack cards directly (they're on
              # its unsupported list), so this mod-card wrapper styles the
              # stack from outside. By default horizontal-stack gives every
              # card an equal share of the row; these rules let the pills
              # hug their content instead, spaced like Chirpy's tag cloud,
              # wrapping on narrow screens.
              style:
                .: |
                  ha-card {
                    background: none !important;
                    border: none !important;
                    box-shadow: none !important;
                  }
                hui-horizontal-stack-card $: |
                  #root {
                    justify-content: flex-start;
                    flex-wrap: wrap;
                    gap: 10px;
                  }
                  #root > * {
                    flex: 0 0 auto !important;
                    width: auto !important;
                    min-width: 0 !important;
                    margin: 0 !important;
                  }
            card:
              type: horizontal-stack
              cards:
                # --- FILTER PILLS ---
                # Active = solid person color; hidden = quiet "ghost" pill.
                - type: custom:bubble-card
                  card_type: button
                  button_type: name
                  name: School
                  icon: mdi:school
                  show_icon: true
                  show_name: true
                  tap_action:
                    action: perform-action
                    perform_action: script.toggle_calendar_filter
                    data:
                      filter_entity: input_text.school_calendar_filter
                  hold_action:
                    action: navigate
                    navigation_path: "#agenda-school"
                  sub_button:
                    main: []
                    bottom: []
                  button_action:
                    tap_action:
                      action: perform-action
                      perform_action: script.toggle_calendar_filter
                      target: {}
                      data:
                        filter_entity: input_text.school_calendar_filter
                  styles: |
                    .bubble-button-card-container {
                      background: none !important;
                      border-radius: var(--skylight-radius-card, 10px) !important;
                    }
                    .bubble-icon-container {
                      border-radius: var(--skylight-radius-chip, 6px) !important;
                    }
                    ha-card {
                      border-radius: var(--skylight-radius-card, 10px) !important;
                      border: 1px solid ${hass.states['input_text.school_calendar_filter'].state === '.*' ? 'var(--skylight-btn-off-border, #e9ecef)' : 'transparent'} !important;
                      box-shadow: ${hass.states['input_text.school_calendar_filter'].state === '.*' ? 'none' : 'var(--skylight-btn-shadow, 0 2px 6px rgba(104, 104, 104, 0.14))'} !important;
                      transition: box-shadow .25s ease, border-color .25s ease !important;
                    }
                    .bubble-button-background {
                      opacity: 1 !important;
                      border-radius: var(--skylight-radius-card, 10px) !important;
                      background-color: ${hass.states['input_text.school_calendar_filter'].state === '.*' ? 'var(--skylight-btn-off-bg, #ffffff)' : 'var(--school-default-primary-color)'} !important;
                    }
                    .bubble-icon-container {
                      background: ${hass.states['input_text.school_calendar_filter'].state === '.*' ? 'var(--skylight-btn-off-icon-bg, rgba(0, 0, 0, 0.04))' : 'rgba(255, 255, 255, 0.22)'} !important;
                    }
                    .bubble-icon {
                      opacity: 1 !important;
                      color: ${hass.states['input_text.school_calendar_filter'].state === '.*' ? 'var(--skylight-btn-off-text, #757575)' : '#ffffff'} !important;
                    }
                    .bubble-name {
                      opacity: 1 !important;
                      font-weight: 600 !important;
                      letter-spacing: 0.01em !important;
                      color: ${hass.states['input_text.school_calendar_filter'].state === '.*' ? 'var(--skylight-btn-off-text, #757575)' : '#ffffff'} !important;
                    }
