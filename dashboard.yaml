views:
  - type: sections
    max_columns: 10
    title: Family Calendar
    path: family-calendar
    theme: Skylight
    sections:
      # --- START HEADER SECTION (Date & Weather) ---
      - type: grid
        cards:
          - type: custom:better-moment-card
            parentStyle: |
              line-height:normal;
            moment:
              - parentStyle: |
                  font-size:1em; text-align:center; margin-top:5px;
                templateRaw: |
                  {{moment format=cccc}}
              - parentStyle: |
                  font-size:1.5em; text-align:center; margin-top:5px;
                templateRaw: |
                  {{moment format=LLLL dd, yyyy}}              
              - parentStyle: |
                  font-size:4em;  text-align:center; font-weight:400;
                templateRaw: |
                  {{moment format=HH:mm}} 
            grid_options:
              columns: 20
            card_mod:
              style: |
                ha-card {
                  background: transparent !important;
                  box-shadow: none !important;
                  border: none !important;
                }
          - type: custom:weather-card
            entity: weather.home   # <--- UPDATE THIS ENTITY
            current: true
            details: true
            forecast: false
            grid_options:
              columns: 20
              rows: 3
          - type: weather-forecast
            show_current: false
            show_forecast: true
            entity: weather.home   # <--- UPDATE THIS ENTITY
            forecast_type: daily
            name: Weather Forecast
            grid_options:
              columns: 20
              rows: 3
            card_mod:
              style: |
                ha-card {
                  background: transparent !important;
                  box-shadow: none !important;
                  border: none !important;
                }
        column_span: 10
      # --- End HEADER SECTION (Date & Weather) ---
      # --- OPTIONAL: MEAL PLANNER STRIP (Skylight-style dinner row) ---
      # To enable: add a Local Calendar named "Dinner" (entity: calendar.dinner),
      # then uncomment this section. Add dinner plans as all-day events.
      # - type: grid
      #   cards:
      #     - type: custom:week-planner-card
      #       calendars:
      #         - entity: calendar.dinner # <--- UPDATE THIS ENTITY if yours differs
      #           name: Dinner
      #           color: "var(--family-default-primary-color)"
      #       days: 7
      #       startingDay: monday # keep in sync with the main calendar's STARTDAY
      #       showNavigation: false
      #       showWeekDayText: true
      #       compact: true
      #       hidePastEvents: false
      #       hideDaysWithoutEvents: false
      #       locale: en
      #       card_mod:
      #         style: |
      #           ha-card {
      #             background: var(--skylight-cal-card-background, rgba(255, 255, 255, 0.6)) !important;
      #             border-radius: 24px !important;
      #             box-shadow: none !important;
      #           }
      #   column_span: 10
      # --- End MEAL PLANNER STRIP ---
      # --- START CONTROLS SECTION (Buttons) ---
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: markdown
                content: " "
                card_mod:
                  style: |
                    ha-card { background: none; box-shadow: none; border: none; }
                grid_options:
                  columns: 18
                  rows: auto
            grid_options:
              columns: 120
              rows: auto
          - type: vertical-stack
            cards:
              - type: markdown
                content: "## Family Calendar"
                card_mod:
                  style: |
                    ha-card { background: none; box-shadow: none; border: none; }
                grid_options:
                  columns: 18
                  rows: auto
            grid_options:
              columns: 120
              rows: auto
          - type: horizontal-stack
            cards:
              # --- BUTTONS ---
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: School
                icon: mdi:school
                show_icon: true
                show_name: true
                tap_action:
                  action: perform-action
                  perform_action: script.toggle_calendar_filter
                  data:
                    filter_entity: input_text.school_calendar_filter
                hold_action:
                  action: navigate
                  navigation_path: "#agenda-school"
                styles: |
                  .bubble-button-background {
                    opacity: 1 !important;
                    background-color: ${hass.states['input_text.school_calendar_filter'].state === '.*' ? 'lightgrey' : 'var(--school-default-primary-color)'} !important;
                  }
              # To show a person avatar instead, use button_type: state with entity: person.daniel
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: Daniel
                icon: mdi:account
                show_icon: true
                show_name: true
                tap_action:
                  action: perform-action
                  perform_action: script.toggle_calendar_filter
                  data:
                    filter_entity: input_text.daniel_calendar_filter
                hold_action:
                  action: navigate
                  navigation_path: "#agenda-daniel"
                styles: |
                  .bubble-button-background {
                    opacity: 1 !important;
                    background-color: ${hass.states['input_text.daniel_calendar_filter'].state === '.*' ? 'lightgrey' : 'var(--daniel-default-primary-color)'} !important;
                  }
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: Weather
                icon: mdi:weather-partly-cloudy
                show_icon: true
                show_name: true
                tap_action:
                  action: perform-action
                  perform_action: script.toggle_calendar_filter
                  data:
                    filter_entity: input_text.weather_calendar_filter
                hold_action:
                  action: navigate
                  navigation_path: "#agenda-weather"
                styles: |
                  .bubble-button-background {
                    opacity: 1 !important;
                    background-color: ${hass.states['input_text.weather_calendar_filter'].state === '.*' ? 'lightgrey' : 'var(--weather-default-primary-color)'} !important;
                  }
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: Family
                icon: mdi:human-male-female-child
                show_icon: true
                show_name: true
                tap_action:
                  action: perform-action
                  perform_action: script.toggle_calendar_filter
                  data:
                    filter_entity: input_text.family_calendar_filter
                styles: |
                  .bubble-button-background {
                    opacity: 1 !important;
                    background-color: ${hass.states['input_text.family_calendar_filter'].state === '.*' ? 'lightgrey' : 'var(--family-default-primary-color)'} !important;
                  }
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: Birthdays
                icon: mdi:cake-variant
                show_icon: true
                show_name: true
                tap_action:
                  action: perform-action
                  perform_action: script.toggle_calendar_filter
                  data:
                    filter_entity: input_text.birthdays_calendar_filter
                styles: |
                  .bubble-button-background {
                    opacity: 1 !important;
                    background-color: ${hass.states['input_text.birthdays_calendar_filter'].state === '.*' ? 'lightgrey' : 'var(--birthdays-default-primary-color)'} !important;
                  }
              - type: custom:bubble-card
                card_type: button
                button_type: name
                name: Holidays
                icon: mdi:bag-personal
                show_icon: true
                show_name: true
                tap_action:
                  action: perform-action
                  perform_action: script.toggle_calendar_filter
                  data:
                    filter_entity: input_text.holidays_calendar_filter
                styles: |
                  .bubble-button-background {
                    opacity: 1 !important;
                    background-color: ${hass.states['input_text.holidays_calendar_filter'].state === '.*' ? 'lightgrey' : 'var(--holidays-default-primary-color)'} !important;
                  }
            grid_options:
              columns: 45
              rows: auto
          - type: markdown
            content: " "
            grid_options:
              columns: 3
              rows: auto
          - type: custom:bubble-card
            card_type: button
            button_type: name
            card_layout: large
            name: Add Event
            icon: mdi:calendar-plus
            tap_action:
              action: navigate
              navigation_path: "#addcalendarevent"
            styles: |
              * { font-size: 1.05em !important; }
              ha-card { --bubble-main-background-color: #393745 !important; width: 300px; }    
              .bubble-icon { --mdc-icon-size: 30px !important; color: snow !important; opacity: 1; }
              .bubble-icon-container { background: #393745 !important; display: flex; }
              .bubble-name { color: snow !important; opacity: 1; display: flex; line-height: 18px; flex-direction: row; justify-content: center; flex-grow: 1; margin: 0 40px 0 0; pointer-events: none; position: relative; overflow: hidden; }
            grid_options:
              columns: 10
              rows: 1
          - type: custom:bubble-card
            card_type: button
            button_type: name
            card_layout: large
            name: Chores
            icon: mdi:clipboard-check-outline
            tap_action:
              action: navigate
              navigation_path: "#chores"
            styles: |
              * { font-size: 1.05em !important; }
              ha-card { --bubble-main-background-color: #393745 !important; width: 200px; }
              .bubble-icon { --mdc-icon-size: 30px !important; color: snow !important; opacity: 1; }
              .bubble-icon-container { background: #393745 !important; display: flex; }
              .bubble-name { color: snow !important; opacity: 1; display: flex; line-height: 18px; flex-direction: row; justify-content: center; flex-grow: 1; margin: 0 40px 0 0; pointer-events: none; position: relative; overflow: hidden; }
            grid_options:
              columns: 7
              rows: 1
          - type: custom:bubble-card
            card_type: select
            entity: input_select.calendar_view
            show_name: true
            show_state: true
            name: Select View
            show_last_changed: false
            show_attribute: false
        column_span: 10
      # --- End CONTROLS SECTION (Buttons) ---        
      # --- START CALENDAR SECTION (Week Planner Card) ---
      - type: grid
        cards:
          - type: custom:config-template-card
            entities:
              - input_text.school_calendar_filter
              - input_text.daniel_calendar_filter
              - input_text.weather_calendar_filter
              - input_text.family_calendar_filter
              - input_text.holidays_calendar_filter
              - input_text.birthdays_calendar_filter
              - input_select.calendar_view
            variables:
              SCHOOLCAL: states['input_text.school_calendar_filter']?.state
              DANIELCAL: states['input_text.daniel_calendar_filter']?.state
              WEATHERCAL: states['input_text.weather_calendar_filter']?.state
              FAMCAL: states['input_text.family_calendar_filter']?.state
              HOLCAL: states['input_text.holidays_calendar_filter']?.state
              BIRCAL: states['input_text.birthdays_calendar_filter']?.state
              VIEW: states['input_select.calendar_view']?.state
              STARTDAY: |
                (() => {
                  const calendarView = states['input_select.calendar_view']?.state;
                  if (calendarView === 'Today') return 'today';
                  if (calendarView === 'Tomorrow') return 'tomorrow';
                  // Fallback <--- UPDATE THIS IF NEEDED, valid values are: monday, tuesday, wednesday, thursday, friday, saturday, sunday
                  return 'monday';
                })()
              DAYS: |
                (() => {
                  const calendarView = states['input_select.calendar_view']?.state;
                  if (calendarView === 'Today') return 1;
                  if (calendarView === 'Tomorrow') return 1;
                  if (calendarView === 'Week') return 7;
                  if (calendarView === 'Biweek') return 14;
                  // else return "month"
                  return "month";
                })()
              COLS: |
                (() => {
                  const calendarView = states['input_select.calendar_view']?.state;
                  if (calendarView === 'Today' || calendarView === 'Tomorrow') return 1;
                  return 7;
                })()
              WEEKEND_CSS: |
                (() => {
                  const calendarView = states['input_select.calendar_view']?.state;
                  if (calendarView === 'Today' || calendarView === 'Tomorrow') return '';
                  // Keep this in sync with the STARTDAY fallback above.
                  const startingDay = 'monday';
                  const week = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
                  const idx = week.indexOf(startingDay);
                  // Header cells are :nth-of-type(offset + 2), offset counted from the starting day.
                  const sat = ((5 - idx + 7) % 7) + 2;
                  const sun = ((6 - idx + 7) % 7) + 2;
                  return '.container > .day.header:nth-of-type(' + sat + ') .text, ' +
                         '.container > .day.header:nth-of-type(' + sun + ') .text ' +
                         '{ color: var(--skylight-weekend-text-color, #d32f2f) !important; }';
                })()
            card:
              type: custom:week-planner-card
              calendars:
                # --- MAP CALENDARS HERE ---
                - entity: calendar.school
                  name: School
                  color: "var(--school-default-primary-color)"
                  filter: ${ SCHOOLCAL }
                - entity: calendar.daniel
                  name: Daniel
                  color: "var(--daniel-default-primary-color)"
                  filter: ${ DANIELCAL }
                - entity: calendar.weather
                  name: Weather
                  color: "var(--weather-default-primary-color)"
                  filter: ${ WEATHERCAL }
                - entity: calendar.family
                  name: Family
                  color: "var(--family-default-primary-color)"
                  filter: ${ FAMCAL }
                - entity: calendar.birthdays
                  name: Birthdays
                  color: "var(--birthdays-default-primary-color)"
                  filter: ${ BIRCAL }
                - entity: calendar.holidays # <--- Check this entity ID after adding the Holiday integration
                  name: Holidays
                  color: "var(--holidays-default-primary-color)"
                  filter: ${ HOLCAL }
              days: ${ DAYS }
              startingDay: ${ STARTDAY }
              showNavigation: true
              showWeekDayText: false # <--- Requires week-planner-card v1.13.0 or higher
              startingDayOffset: 0
              hideWeekend: false
              noCardBackground: false
              compact: false
              weather:
                showCondition: true
                showTemperature: true
                showLowTemperature: true
                useTwiceDaily: false
                entity: weather.home # <--- UPDATE THIS ENTITY
              locale: en
              showLocation: true
              hidePastEvents: false
              hideDaysWithoutEvents: false
              hideTodayWithoutEvents: false
              combineSimilarEvents: true
              showLegend: false
              legendToggle: false
              card_mod:
                # config-template-card can't substitute ${...} inside a larger
                # string (it evals everything between the string's first "${"
                # and its final character), so the whole style must be ONE
                # template: a JS template literal returning the CSS, in which
                # COLS and WEEKEND_CSS interpolate normally.
                style: |-
                  ${`
                    /* === BASE SAFETY === */
                    :host {
                      overflow: hidden;
                    }

                    /* === CARD BASE === */
                    ha-card {
                      background: var(--skylight-cal-card-background, rgba(255, 255, 255, 0.6)) !important;
                      border-radius: 24px !important;
                      box-shadow: none !important;
                      height: clamp(480px, 70vh, 900px) !important;
                      max-height: clamp(480px, 70vh, 900px) !important;
                    }

                    /* === GRID LAYOUT === */
                    /* The column count follows the selected view (7 for
                       Week/Biweek/Month, 1 for Today/Tomorrow) via the COLS
                       template variable above. */
                    .container {
                      display: grid !important;
                      grid-template-columns: repeat(${COLS}, minmax(0, 1fr)) !important;
                      grid-auto-flow: row dense !important;
                      gap: 0 !important;
                    }

                    .container .navigation,
                    .container .header {
                      grid-column: 1 / -1 !important;
                    }

                    /* WEEKDAY LABEL CELLS */
                    .day.header {
                      display: block !important;
                      grid-column: auto !important;
                      margin: 0 !important;
                      padding: 0.2em !important;
                      text-align: center !important;
                      box-sizing: border-box !important;
                    }

                    .day.header .date .text {
                      font-weight: 600 !important;
                    }

                    /* === DAY TILES === */
                    .day {
                      border: solid 1px var(--skylight-day-border-color, whitesmoke) !important;
                      padding: 0.2% !important;
                      width: auto !important;
                      min-width: 0 !important;
                      margin: 0 !important;
                      box-sizing: border-box !important;
                      align-self: stretch !important;
                      justify-self: stretch !important;
                    }

                    /* === YOUR ORIGINAL VISUAL RULES === */
                    .event.past {
                      opacity: .2 !important;
                      background-color: var(--skylight-past-event-color, gray) !important;
                    }

                    .time {
                      color: var(--skylight-event-text-color, #333333) !important;
                      font-size: 0.8em !important;
                    }

                    .event {
                      color: var(--skylight-event-text-color, #333333) !important;
                      line-height: 16px !important;
                      background-color: var(--border-color) !important;
                      border-radius: 10px !important;
                      max-height: 80px !important;
                      overflow: hidden !important;
                      font-size: 1.1em !important;
                    }

                    .none {
                      background-color: transparent !important;
                    }

                    .today .number {
                      border-radius: 5px !important;
                      background-color: var(--skylight-today-highlight-color, orange) !important;
                      padding-left: 4px !important;
                      padding-right: 4px !important;
                    }

                    .day .date .text {
                      font-size: 1em !important;
                      font-weight: bold !important;
                    }

                    .day .date .number {
                      font-weight: bold !important;
                      font-size: 3em !important;
                    }

                    /* Weekday colors */

                    /* When showWeekDayText is true */
                    .day[data-weekday="1"] .date .text,
                    .day[data-weekday="2"] .date .text,
                    .day[data-weekday="3"] .date .text,
                    .day[data-weekday="4"] .date .text,
                    .day[data-weekday="5"] .date .text {
                      color: var(--skylight-weekday-text-color, #2e7d32) !important;
                    }

                    .day[data-weekday="6"] .date .text,
                    .day[data-weekday="7"] .date .text {
                      color: var(--skylight-weekend-text-color, #d32f2f) !important;
                    }
                    /* When showWeekDayText is false */
                    .container > .day.header .text {
                      color: var(--skylight-weekday-text-color, #2e7d32) !important;
                    }
                    /* Weekend header cells: computed from the starting day by the
                       WEEKEND_CSS template variable, so they stay correct if you
                       change STARTDAY. */
                    ${WEEKEND_CSS}


                    /* === RESPONSIVE BREAKPOINTS === */
                    @media (max-width: 1024px) {
                      .day .date .number { font-size: 2em !important; }
                      .day .date .text   { font-size: 0.95em !important; }
                    }

                    @media (max-width: 768px) {
                      .day .date .number { font-size: 1.6em !important; }
                      .day .date .text   { font-size: 0.85em !important; }
                      .event { font-size: 0.85em !important; line-height: 1.1em !important; }
                      .time  { font-size: 0.75em !important; }
                    }

                    /* ========================================================= */
                    /* === MOBILE OVERLAP FIX + TWO‑LINE WRAP FOR TITLES ======== */
                    /* ========================================================= */
                    @media (max-width: 480px) {

                      :host {
                        font-size: clamp(10px, 2.6vw, 13px) !important;
                      }

                      /* Condensed headers */
                      .container .header,
                      .container .navigation {
                        padding: 0.25em 0.4em !important;
                      }

                      /* Day tiles tighter */
                      .day {
                        padding: 0.15em !important;
                        min-width: 0 !important;
                      }

                      /* Smaller date numbers */
                      .day .date .number {
                        font-size: clamp(1.1em, 4.5vw, 1.4em) !important;
                        line-height: 1.1 !important;
                      }
                      .day .date .text {
                        font-size: clamp(0.72em, 3.2vw, 0.85em) !important;
                        line-height: 1.1 !important;
                      }

                      /* Event chip reduced */
                      .event {
                        font-size: clamp(0.72em, 2.9vw, 0.85em) !important;
                        line-height: 1.05em !important;
                        padding: 0.25em 0.35em !important;
                        max-height: 62px !important;
                      }

                      .time {
                        font-size: clamp(0.65em, 2.5vw, 0.78em) !important;
                      }

                      /* === TWO-LINE WRAP FOR TITLES === */
                      .event .title,
                      .event .name,
                      .event .summary,
                      .event .location,
                      .event .desc,
                      .event .description {
                        display: -webkit-box !important;
                        -webkit-box-orient: vertical !important;
                        -webkit-line-clamp: 2 !important;   /* <<< Two lines max */
                        overflow: hidden !important;
                        text-overflow: ellipsis !important;
                        white-space: normal !important;
                        line-height: 1.1em !important;
                        max-height: calc(1.1em * 2) !important;
                      }
                    }

                    /* Slightly larger phones / small tablets */
                    @media (min-width: 481px) and (max-width: 768px) {

                      :host {
                        font-size: clamp(11px, 2.2vw, 14px) !important;
                      }

                      .event {
                        max-height: 72px !important;
                      }

                      .event .title,
                      .event .name,
                      .event .summary {
                        display: -webkit-box !important;
                        -webkit-line-clamp: 2 !important;
                        overflow: hidden !important;
                      }
                    }
                  `}
            grid_options:
              columns: 120
              rows: 1
              showDescription: false
        column_span: 10
      # --- End CALENDAR SECTION (Week Planner Card) ---
      # --- START POPUP SECTION (Hidden) ---
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#addcalendarevent"
                button_type: name
                name: Add Calendar Event
                icon: mdi:calendar-plus
                show_icon: true
                show_name: true
                styles: |
                  .bubble-button-card-container {
                    background:
                    ${hass.states['input_select.calendar_select'].state == 'School' ? 'var(--school-default-primary-color)'
                    : hass.states['input_select.calendar_select'].state == 'Daniel' ? 'var(--daniel-default-primary-color)'
                    : hass.states['input_select.calendar_select'].state == 'Weather' ? 'var(--weather-default-primary-color)'
                    : hass.states['input_select.calendar_select'].state == 'Family' ? 'var(--family-default-primary-color)'
                    : 'gray'} !important;
                  }
              - type: vertical-stack
                cards:
                  - type: entities
                    entities:
                      - entity: input_select.calendar_select
                      - entity: input_text.calendar_event_title
                        name: Event Title
                      - entity: input_text.calendar_event_description
                        name: Event Description
                      - entity: input_boolean.calendar_all_day_event
                        name: All Day Event
                    title: Add Calendar Event
                    state_color: false
                  - type: conditional
                    conditions:
                      - entity: input_boolean.calendar_all_day_event
                        state: "off"
                    card:
                      type: entities
                      entities:
                        - entity: input_datetime.calendar_event_start
                          name: Start Time
                        - entity: input_datetime.calendar_event_end
                          name: End Time
                  - type: conditional
                    conditions:
                      - entity: input_boolean.calendar_all_day_event
                        state: "on"
                    card:
                      type: entities
                      entities:
                        - entity: input_datetime.calendar_day_event_start
                          name: Event Start Date
                        - entity: input_datetime.calendar_day_event_end
                          name: Event End Date
                  - type: custom:bubble-card
                    card_type: button
                    button_type: name
                    name: Add Event to Calendar
                    icon: mdi:calendar-check
                    show_icon: true
                    show_name: true
                    tap_action:
                      action: perform-action
                      perform_action: script.add_calendar_event
                    styles: |
                      .bubble-button-background {
                        opacity: 1 !important;
                        background-color: ${hass.states['input_select.calendar_select'].state == 'School' ? 'var(--school-default-primary-color)'
                        : hass.states['input_select.calendar_select'].state == 'Daniel' ? 'var(--daniel-default-primary-color)'
                        : hass.states['input_select.calendar_select'].state == 'Weather' ? 'var(--weather-default-primary-color)'
                        : hass.states['input_select.calendar_select'].state == 'Family' ? 'var(--family-default-primary-color)'
                        : 'gray'} !important;
                      }
          # --- CHORES POPUP ---
          # Requires the Local To-do integration: create one list per person
          # (Settings > Devices & Services > Add Integration > Local To-do).
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#chores"
                button_type: name
                name: Family Chores
                icon: mdi:clipboard-check-outline
                show_icon: true
                show_name: true
              - type: todo-list
                entity: todo.daniel # <--- UPDATE THIS ENTITY (Local To-do list)
                title: Daniel
              - type: todo-list
                entity: todo.family # <--- UPDATE THIS ENTITY (Local To-do list)
                title: Family
          # --- PER-CALENDAR TODAY AGENDA POPUPS (opened by holding a calendar's button) ---
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#agenda-school"
                button_type: name
                name: School — Today
                icon: mdi:calendar-today
                show_icon: true
                show_name: true
              - type: custom:week-planner-card
                calendars:
                  - entity: calendar.school
                    name: School
