                    ha-card {
                      background: var(--skylight-surface, var(--card-background-color)) !important;
                      border-radius: var(--skylight-radius-card, 10px) !important;
                      border: none !important;
                      box-shadow: none !important;
                    }
                    .event {
                      color: var(--skylight-event-text-color, #34343c) !important;
                      background-color: var(--skylight-event-bg, #ffffff) !important;
                      background-color: color-mix(in srgb, var(--border-color) 8%, var(--skylight-event-bg, #ffffff)) !important;
                      border: 1px solid var(--skylight-event-border, #eaeaea) !important;
                      border-left: 3px solid var(--border-color) !important;
                      border-radius: var(--skylight-radius-chip, 6px) !important;
                      box-shadow: var(--skylight-event-shadow, 0 1px 2px rgba(52, 52, 60, 0.05)) !important;
                      min-width: 0 !important;
                      overflow: hidden !important;
                    }
                    /* Let the chip's inner flex column shrink so long words
                       wrap instead of being clipped at the chip edge */
                    .event .inner {
                      min-width: 0 !important;
                    }
                    .event .title,
                    .event .location {
                      overflow-wrap: anywhere !important;
                    }
                    .event .title,
                    .event .name,
                    .event .summary {
                      font-weight: 600 !important;
                    }
                    .time {
                      color: var(--skylight-event-time-color, #757575) !important;
                      font-size: 0.8em !important;
                      font-weight: 600 !important;
                    }
                    .none {
                      background-color: transparent !important;
                      color: var(--secondary-text-color) !important;
                    }
    cards: []
    icon: mdi:calendar-blank-multiple
    background:
      opacity: 40
      alignment: center
      size: cover
      repeat: repeat
      attachment: fixed
      # Use File Editor and upload assets/calbackgrd.webp to /www/ folder, this translates to /local on this dashboard, so leave /local here.
      image: /local/calbackgrd.webp # <--- UPDATE THIS if you use your own background image
