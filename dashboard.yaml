                      font-family: var(--skylight-heading-font-family, var(--primary-font-family));
                      font-size: 1.7em;
                      font-weight: 700;
                      letter-spacing: -0.01em;
                      color: var(--primary-text-color);
                    }
                grid_options:
                  columns: 18
                  rows: auto
            grid_options:
              columns: 120
              rows: auto
          - type: custom:mod-card
            grid_options:
              columns: 45
              rows: auto
            card_mod:
              # card-mod can't attach to stack cards directly (they're on
              # its unsupported list), so this mod-card wrapper styles the
              # stack from outside. By default horizontal-stack gives every
              # card an equal share of the row; these rules let the pills
              # hug their content instead, spaced like Chirpy's tag cloud,
              # wrapping on narrow screens.
              style:
                .: |
                  ha-card {
                    background: none !important;
                    border: none !important;
                    box-shadow: none !important;
                  }
                hui-horizontal-stack-card $: |
                  #root {
                    justify-content: flex-start;
                    flex-wrap: wrap;
                    gap: 10px;
                  }
                  #root > * {
                    flex: 0 0 auto !important;
                    width: auto !important;
                    min-width: 0 !important;
                    margin: 0 !important;
                  }
            card:
              type: horizontal-stack
              cards:
                # --- FILTER PILLS ---
                # Active = solid person color; hidden = quiet "ghost" pill.
